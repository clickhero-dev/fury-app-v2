version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fury-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fury_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fury_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fury}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fury-network

  redis:
    image: redis:7-alpine
    container_name: fury-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fury-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  fury-network:
    driver: bridge
    