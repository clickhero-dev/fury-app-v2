version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fury-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fury_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fury_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fury}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fury-network

  redis:
    image: redis:7-alpine
    container_name: fury-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fury-network

  grafana:
    image: grafana/grafana:latest
    container_name: fury-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=estagiario@2026#
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - fury-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  fury-network:
    driver: bridge