[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build --workspace=packages/shared && npm run build --workspace=packages/db && rm -rf apps/api/dist && npm run build --workspace=apps/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
