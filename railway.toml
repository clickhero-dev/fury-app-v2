[build]
builder = "nixpacks"
buildCommand = "npm install --include=dev && npm run build --workspace=@fury/shared && npm run build --workspace=@fury/db && npm run build --workspace=@fury/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
