[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build --workspace=packages/shared && npm run build --workspace=packages/db"

[deploy]
startCommand = "npm run db:migrate && node --loader ts-node/esm apps/api/src/index.ts"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
NODE_VERSION = "22"
