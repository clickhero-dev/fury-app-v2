name: fury-api
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fury-api
    restart: unless-stopped
    network_mode: "infra_fury-network"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://fury-redis:6379
    extra_hosts:
      - "fury-postgres:172.26.0.3"
      - "fury-redis:172.26.0.2"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra_fury-network:
    external: true
