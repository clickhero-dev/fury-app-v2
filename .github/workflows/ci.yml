name: CI - EasyPanel
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx tsc -b
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - run: npm run build
      - run: npm run test:unit