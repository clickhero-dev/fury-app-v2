name: Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API on EasyPanel
        run: |
          curl -s -X POST "${{ secrets.EASYPANEL_API_DEPLOY_WEBHOOK }}" || true

      - name: Deploy Web on EasyPanel
        run: |
          curl -s -X POST "${{ secrets.EASYPANEL_WEB_DEPLOY_WEBHOOK }}" || true
